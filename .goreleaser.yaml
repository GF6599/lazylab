version: 2

builds:
  - main: ./cmd/lazylab
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: lazylab
    repository:
      owner: GF6599
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/GF6599/lazylab
    description: A Bubble Tea-powered terminal UI for browsing GitLab projects, pipelines, and repository files
    license: MIT
    # The download domain differs from the homepage, which `brew audit` rejects
    # until the release host is named here.
    url:
      verified: github.com/GF6599/lazylab
    # Homebrew quarantines what a cask downloads, and macOS reports a quarantined
    # binary that nobody notarized as damaged rather than running it. Notarizing
    # needs a paid Apple developer account, so the cask clears the attribute.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazylab"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
