[package]
name = "lazylab"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
description = "Terminal UI for GitLab"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
