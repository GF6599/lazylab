[package]
name = "lazylab"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
description = "Terminal UI for GitLab"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10", features = ["env", "toml", "yaml", "json"] }
regex = "1.13"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
