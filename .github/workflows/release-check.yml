name: Release check

# dist calls a local artifacts job with a plan input, and ci.yml declares none.
# This workflow takes the input so that a release runs the same checks as a
# pull request.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
