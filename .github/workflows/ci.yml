name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race ./...

      # The tool directive in go.mod pins the scanner, so this job and a laptop
      # report the same findings.
      - run: go tool govulncheck ./...

      # gofumpt and staticcheck are deliberately absent: both fail on code that
      # predates this gate. `just lint` still runs them locally.
