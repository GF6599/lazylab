name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this so a tag is held to the checks a pull request runs, and
  # the two definitions of a passing build cannot drift apart.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup reads rust-toolchain.toml, so this job and a laptop run the same compiler and
      # the same clippy lints.
      - run: rustup toolchain install

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      # Built from source by the toolchain of this job, because the cargo-deny
      # action downloads its binary with no checksum check.
      - run: cargo install --locked cargo-deny@0.20.2

      - run: cargo deny check advisories

      - run: cargo test --locked
