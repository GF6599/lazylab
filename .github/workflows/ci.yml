name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this so a tag is held to the checks a pull request runs, and
  # the two definitions of a passing build cannot drift apart.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race ./...

      # Every tool below is pinned by a tool directive in go.mod, so this job
      # and a laptop report the same findings.
      - run: go tool staticcheck ./...

      # -d is what fails the step on a diff, and it prints the diff that failed
      # it. Passing -l alone would list the same files and still exit 0.
      - run: go tool gofumpt -l -d .

      - run: go tool govulncheck ./...
